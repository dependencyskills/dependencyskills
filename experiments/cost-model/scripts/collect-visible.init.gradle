// Dumps the set of modules a developer can actually IMPORT, as distinct from
// the set the build declares.
//
//   ./gradlew -I collect-visible.init.gradle dsVis -q --no-configuration-cache
//
// VISIBLE rows are everything resolved onto a compile classpath: declared
// dependencies plus every transitive an `api` edge exposes. That is what an
// IDE will autocomplete and what compiles without touching the build file,
// which is the number that matters for "how many libraries is this developer
// working with". RUNTIME rows are resolved but not compile-visible.
//
// Test configurations are excluded, so these are production figures.

import org.gradle.api.artifacts.component.ModuleComponentIdentifier
allprojects { p ->
  p.tasks.register("dsVis") {
    doLast {
      p.configurations.each { c ->
        if (!c.canBeResolved) return
        def isTest = c.name.startsWith("test") || c.name.contains("Test")
        if (isTest) return
        def compileish = c.name ==~ /.*([Cc]ompileClasspath|[Kk]libraries)$/
        def runtimeish = c.name ==~ /.*[Rr]untimeClasspath$/
        if (!compileish && !runtimeish) return
        try {
          c.incoming.resolutionResult.allComponents.each { comp ->
            def id = comp.id
            if (!(id instanceof ModuleComponentIdentifier)) return
            println "${compileish ? 'VISIBLE' : 'RUNTIME'}\t${id.group}:${id.module}"
          }
          c.allDependencies.each { d -> if (d.group != null) println "DECL\t${d.group}:${d.name}" }
        } catch (Exception ignored) {}
      }
    }
  }
}
