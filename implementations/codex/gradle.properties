org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.code.style=official

# The encoder artifact versions with the model, not with the plugin.
encoderVersion=1.5.0

# The plugin and core version. The encoder versions separately, with its model.
version=0.1.0

# A shared `nativeMain` source set that uses cinterop bindings needs them commonized, or its
# metadata compilation cannot see the interop package at all - which presents as an unresolved
# reference in code that compiles fine per target.
kotlin.mpp.enableCInteropCommonization=true
