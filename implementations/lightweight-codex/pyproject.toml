[project]
name = "dependencyskills-lightweight-codex"
version = "0.1.0a1"
description = "Serves the skills a project's dependencies ship to that project's coding agent, over MCP."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dependencyskills = "dependencyskills_lightweight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependencyskills_lightweight"]
