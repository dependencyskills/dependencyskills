  .hiw .amber-s { fill:#A5701A; }
  .hiw .teal-b { fill:#E3F4F1; stroke:#4C9E93; stroke-width:1; }
  .hiw .teal-t { fill:#0F4F49; }
  .hiw .teal-s { fill:#2A776E; }
